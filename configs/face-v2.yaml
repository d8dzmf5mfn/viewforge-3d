schema_version: 2
profile: face-v2
mode: pixel-flame-hybrid
deterministic: true
seed: 20260809

assets:
  flame_model: .local/models/flame/generic_model.pkl
  flame_landmarks: .local/models/flame/landmark_embedding.npy
  flame_masks: .local/models/flame/FLAME_masks.pkl
  flame_prepared: .local/models/flame/prepared-face-v2.npz
  face_landmarker: .local/models/mediapipe/face_landmarker.task
  canonical_face_model: .local/models/mediapipe/canonical_face_model.obj

input:
  minimum_short_side: 1024
  front_yaw_limit_deg: 10.0
  side_target_yaw_deg: 45.0
  side_yaw_tolerance_deg: 10.0
  pitch_limit_deg: 8.0
  roll_limit_deg: 8.0
  minimum_laplacian_variance: 80.0
  maximum_mouth_gap_ratio: 0.045
  minimum_mask_face_coverage: 0.72
  require_mask_confirmation: true

pixel:
  grid_size: 384
  coarse_depth_grid: 64
  complex_region_radius_pixels: 12.0
  maximum_cells: 200000
  depth_scale_face_width: 0.38
  cell_fill_ratio: 0.92
  base_thickness_pixels: 0.8

fit:
  shape_coefficients: 100
  shared_focal_length: true
  adam_iterations: 400
  lbfgs_iterations: 80
  learning_rate: 0.015
  landmark_weight: 1.0
  contour_weight: 0.24
  shape_prior_weight: 0.003
  symmetry_weight: 0.015
  dense_landmark_weight: 0.55
  relative_depth_weight: 0.025
  local_offset_weight: 0.04
  laplacian_weight: 0.08
  arap_weight: 0.10
  maximum_normal_offset_face_width: 0.015

sdf:
  resolution: 384
  padding_fraction: 0.05
  surface_band_voxels: 1.5
  maximum_instances: 200000
  query_chunk_points: 786432

mesh:
  target_triangles: 160000
  minimum_triangles: 120000
  maximum_triangles: 200000
  taubin_iterations: 0
  taubin_lambda: 0.0
  taubin_nu: 0.0
  feature_protection_radius_voxels: 3.0

skin:
  atlas_resolution: 2048
  detail_resolution: 1024
  uv_albedo_source: assets/materials/skin-v1/head-uv-base-v2.png
  micro_albedo_source: assets/materials/skin-v1/micro-albedo-source.png
  minimum_observed_vertex_fraction: 0.35
  jpeg_quality: 92
  uv_method: xatlas
  local_warp_fraction_max: 0.005
  eye_atlas_resolution: 512

anatomy:
  subdivision_levels: 2
  eye_radius_min_scale: 0.90
  eye_radius_max_scale: 1.10
  eye_radius_symmetry_max: 0.03
  eyelid_clearance_ratio_max: 0.03
  ear_silhouette_iou_min: 0.85

acceptance:
  front_landmark_nme_max: 0.020
  side_landmark_nme_max: 0.025
  front_silhouette_iou_min: 0.93
  side_silhouette_iou_min: 0.90
  silhouette_iou_drop_max: 0.005
  feature_drift_voxels_max: 1.0
  normal_variance_reduction_min: 0.30
  hausdorff_voxels_max: 1.5
  package_size_mb_max: 25.0
  runtime_minutes_max: 10.0
  peak_memory_gb_max: 12.0
  front_landmark_nme_v2_max: 0.015
  side_landmark_nme_v2_max: 0.020
  front_silhouette_iou_v2_min: 0.95
  side_silhouette_iou_v2_min: 0.92
  texture_face_error_px_max: 2.0
  texture_ear_error_px_max: 4.0
  maximum_surface_distance_voxels: 0.75
