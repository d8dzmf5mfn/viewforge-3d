schema_version: 1
profile: face-v1
mode: pixel-direct
deterministic: true
seed: 20260811

assets:
  flame_model: .local/models/flame/generic_model.pkl
  flame_landmarks: .local/models/flame/landmark_embedding.npy
  face_landmarker: .local/models/mediapipe/face_landmarker.task
  canonical_face_model: .local/models/mediapipe/canonical_face_model.obj

input:
  minimum_short_side: 1024
  front_yaw_limit_deg: 10.0
  side_target_yaw_deg: 35.0
  side_yaw_tolerance_deg: 8.0
  pitch_limit_deg: 25.0
  roll_limit_deg: 8.0
  minimum_laplacian_variance: 80.0
  maximum_mouth_gap_ratio: 0.045
  maximum_jaw_open_score: 1.0
  minimum_face_detection_confidence: 0.10
  minimum_face_presence_confidence: 0.10
  minimum_face_tracking_confidence: 0.10
  mask_method: white-background
  minimum_mask_face_coverage: 0.72
  require_mask_confirmation: true

pixel:
  grid_size: 256
  coarse_depth_grid: 40
  complex_region_radius_pixels: 10.0
  maximum_cells: 150000
  depth_scale_face_width: 0.38
  cell_fill_ratio: 0.92
  base_thickness_pixels: 0.8

fit:
  shape_coefficients: 50
  shared_focal_length: true
  adam_iterations: 180
  lbfgs_iterations: 35
  learning_rate: 0.025
  landmark_weight: 1.0
  contour_weight: 0.18
  shape_prior_weight: 0.002
  symmetry_weight: 0.01

sdf:
  resolution: 256
  padding_fraction: 0.05
  surface_band_voxels: 1.5
  maximum_instances: 150000
  query_chunk_points: 1000000

mesh:
  target_triangles: 80000
  minimum_triangles: 50000
  maximum_triangles: 100000
  taubin_iterations: 16
  taubin_lambda: 0.42
  taubin_nu: -0.10
  feature_protection_radius_voxels: 3.0

skin:
  atlas_resolution: 2048
  detail_resolution: 1024
  uv_albedo_source: assets/materials/skin-v1/head-uv-base-v2.png
  micro_albedo_source: assets/materials/skin-v1/micro-albedo-source.png
  minimum_observed_vertex_fraction: 0.25
  jpeg_quality: 92

output:
  geometry_only: true

acceptance:
  front_landmark_nme_max: 0.015
  side_landmark_nme_max: 0.020
  front_silhouette_iou_min: 0.95
  side_silhouette_iou_min: 0.92
  silhouette_iou_drop_max: 0.005
  feature_drift_voxels_max: 1.0
  normal_variance_reduction_min: 0.30
  hausdorff_voxels_max: 1.5
  package_size_mb_max: 25.0
  runtime_minutes_max: 10.0
  peak_memory_gb_max: 12.0
